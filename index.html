<!-- ============================================
     MOONLIGHT DESIGNS WORKSHOP
     PRODUCT LISTING BUILDER
     ============================================ -->

<section id="productLister" class="workshop-tool">

  <div class="tool-header">
    <h2>🛍️ Product Listing Builder</h2>
    <p>
      Create a product title, description, SEO keywords
      and exactly 13 tags.
    </p>
  </div>

  <div class="listing-grid">

    <!-- LEFT SIDE -->
    <div class="listing-panel">

      <h3>✨ Tell Me About Your Product</h3>

      <label>Product Type</label>
      <select id="listingProductType">
        <option value="PNG">PNG Clipart</option>
        <option value="Seamless Pattern">Seamless Pattern</option>
        <option value="Digital Paper">Digital Paper</option>
        <option value="Alpha">Alphabet / Alpha</option>
        <option value="Clipart Bundle">Clipart Bundle</option>
        <option value="Coloring Page">Coloring Page</option>
        <option value="SVG">SVG</option>
        <option value="Digital Download">Digital Download</option>
      </select>

      <label>Main Subject</label>
      <input
        id="listingSubject"
        type="text"
        placeholder="Example: Highland cow"
      >

      <label>Theme</label>
      <input
        id="listingTheme"
        type="text"
        placeholder="Example: Christmas"
      >

      <label>Style</label>
      <select id="listingStyle">
        <option value="cute">Cute & Fun</option>
        <option value="seo">SEO Heavy</option>
        <option value="professional">Professional</option>
        <option value="natural">Natural</option>
        <option value="simple">Short & Simple</option>
      </select>

      <label>Colors</label>
      <input
        id="listingColors"
        type="text"
        placeholder="Example: pink purple blue"
      >

      <label>Extra Details</label>
      <textarea
        id="listingDetails"
        rows="4"
        placeholder="Example: bows, snowflakes, playful face, hand drawn..."
      ></textarea>

      <label>Shop / Platform</label>
      <select id="listingPlatform">
        <option value="general">Website / General</option>
        <option value="etsy">Etsy</option>
        <option value="payhip">Payhip</option>
        <option value="facebook">Facebook</option>
      </select>

      <button
        type="button"
        onclick="generateProductListing()"
        class="moonlight-button"
      >
        ✨ Generate Listing
      </button>

      <button
        type="button"
        onclick="surpriseListing()"
        class="moonlight-button secondary"
      >
        🎲 Surprise Me
      </button>

    </div>


    <!-- RIGHT SIDE -->
    <div class="listing-panel">

      <h3>🌙 Your Listing</h3>

      <label>Product Title</label>

      <textarea
        id="listingTitle"
        rows="3"
      ></textarea>

      <div class="listing-actions">

        <button
          onclick="copyField('listingTitle')"
          class="small-button"
        >
          📋 Copy Title
        </button>

      </div>


      <label>Short Description</label>

      <textarea
        id="listingShortDescription"
        rows="3"
      ></textarea>


      <label>Full Description</label>

      <textarea
        id="listingDescription"
        rows="12"
      ></textarea>

      <div class="listing-actions">

        <button
          onclick="copyField('listingDescription')"
          class="small-button"
        >
          📋 Copy Description
        </button>

      </div>


      <label>SEO Keywords</label>

      <textarea
        id="listingKeywords"
        rows="4"
      ></textarea>


      <div class="tag-heading">

        <label>
          Exactly 13 Tags
        </label>

        <span id="tagCounter">
          13 / 13
        </span>

      </div>

      <div
        id="listingTags"
        class="tag-grid"
      ></div>


      <div class="listing-actions">

        <button
          onclick="copyAllTags()"
          class="small-button"
        >
          📋 Copy 13 Tags
        </button>

        <button
          onclick="regenerateTags()"
          class="small-button"
        >
          🔄 New Tags
        </button>

        <button
          onclick="copyEntireListing()"
          class="small-button"
        >
          📦 Copy Entire Listing
        </button>

      </div>

      <div
        id="listingStatus"
        class="listing-status"
      ></div>

    </div>

  </div>

</section>


<style>

/* ============================================
   PRODUCT LISTING BUILDER STYLE
   ============================================ */

#productLister {
  padding: 20px;
  color: #ffffff;
}

.tool-header {
  text-align: center;
  margin-bottom: 20px;
}

.tool-header h2 {
  font-size: 32px;
  margin-bottom: 5px;

  background:
    linear-gradient(
      90deg,
      #ff69c9,
      #ad82ff,
      #59d6ff
    );

  -webkit-background-clip: text;
  color: transparent;
}

.tool-header p {
  color: #bcb8d5;
}

.listing-grid {
  display: grid;
  grid-template-columns: 380px 1fr;
  gap: 20px;
}

  background: rgba(18,21,46,.94);

  padding: 20px;

}

.listing-panel h3 {
  margin-top: 0;
}

.listing-panel label {
  display: block;
  margin-top: 14px;
  margin-bottom: 6px;

  color: #e5e1f5;
  font-size: 13px;
  font-weight: 700;
}

.listing-panel input,
.listing-panel select,
.listing-panel textarea {

  width: 100%;

  background: #090c21;

  color: white;

  border:
    1px solid #3d416d;

  border-radius: 10px;

  padding: 11px;

  font-size: 14px;
}

.listing-panel textarea {
  resize: vertical;
}

.moonlight-button {

  width: 100%;

  margin-top: 15px;

  padding: 13px;

  border: none;

  border-radius: 12px;

  cursor: pointer;

  font-weight: 800;

  color: white;

  background:
    linear-gradient(
      135deg,
      #825cff,
      #e24daf
    );
}

.moonlight-button.secondary {
  background: #292d54;
}

.listing-actions {

  display: flex;

  flex-wrap: wrap;

  gap: 8px;

  margin-top: 8px;
}

.small-button {

  border: none;

  border-radius: 9px;

  padding: 8px 11px;

  cursor: pointer;

  background: #292d54;

}

.tag-heading {

  display: flex;

  align-items: center;

  justify-content: space-between;

}

#tagCounter {

  .listing-grid {
    grid-template-columns: 1fr;
  }

  .tag-grid {
    grid-template-columns: 1fr;
  }

}

</style>


<script>

/* ============================================
   MOONLIGHT DESIGNS
   LOCAL PRODUCT LISTING ENGINE
   ============================================ */


/* ---------- WORD DATABASES ---------- */

const listingStyles = [

  "cute",
  "whimsical",
  "retro",
  "boho",
  "western",
  "gothic",
  "preppy",
  "colorful",
  "hand drawn",
  "playful",

  "celestial",
  "groovy",

  "minimalist",
  "bold",
  "funny",
  "festive",
  "dreamy"

];


const listingUses = [

  "shirts",
  "tumblers",
  "stickers",
  "sublimation",
  "craft projects",
  "scrapbooking",
  "printable projects",
  "small business projects",
  "digital crafting",
  "custom gifts",
  "signs",
  "decals",
  "party projects",
  "holiday crafts",
  "creative projects"

];


const listingDescriptors = [

  "unique",
  "creative",
  "playful",
  "beautiful",
  "fun",
  "eye catching",
  "whimsical",
  "bold",
  "colorful",
  "charming",
  "festive",
  "adorable",
  "trendy",
  "creative",
  "versatile"

];


const surpriseSubjects = [

  "highland cow",
  "ghost",
  "skeleton",
  "alien",
  "mushroom",
  "owl",
  "cat",
  "raven",
  "frog",
  "butterfly",
  "cow",
  "pig",
  "possum",
  "bee",
  "dragonfly",
  "sunflower",
  "wildflower",
  "moon",
  "witch hat",
  "pumpkin",
  "gingerbread man",
  "snowman",
  "reindeer",
  "cowgirl boot",
  "skull",
  "coffee cup",
  "tarot card"

];


const surpriseThemes = [

  "Christmas",
  "Halloween",
  "Valentine",
  "Anti Valentine",
  "Western",
  "Celestial",
  "Retro",
  "Gothic",
  "Cottagecore",
  "Spring",
  "Summer",
  "Fall",
  "Winter",
  "Birthday",
  "Boho",
  "Groovy",
  "Spooky Cute",
  "Wildflower",
  "Cosmic",
  "Funny"

];


const surpriseColors = [

  "pink purple and blue",
  "rainbow",
  "pastel pink and teal",
  "black red and burgundy",
  "western neutrals",
  "bright retro colors",
  "soft cottagecore colors",
  "neon cosmic colors",
  "traditional Christmas colors",
  "pink Christmas colors",
  "orange black and purple",
  "earth tones",
  "blue and silver",
  "black and hot pink"

];


/* ---------- RANDOM ---------- */

function randomFrom(array) {

  return array[
    Math.floor(
      Math.random() *
      array.length
    )
  ];

}


/* ---------- CLEAN WORDS ---------- */

function cleanWords(text) {

  return text

    .split(/[, ]+/)

    .map(word =>
      word.trim()
      .toLowerCase()
    )

    .filter(Boolean);

}


/* ---------- CREATE TAGS ---------- */

function buildTags(
  subject,
  theme,
  type,
  colors,
  style
) {

  const possible = [

    subject,

    `${subject} ${type}`,

    `${theme} ${subject}`,

    `${theme} ${type}`,

    `${style} ${subject}`,

    `${colors} ${subject}`,

    `${subject} design`,

    `${subject} download`,

    `${theme} design`,

    `${style} design`,

    `${type} download`,

    `digital ${type}`,

    `${subject} clipart`,

    `${theme} clipart`,

    `${subject} printable`,

    `${theme} printable`,

    `${subject} sublimation`,

    `${theme} sublimation`,

    `${subject} craft`,

    `${theme} craft`,

    `small business design`,

    `digital craft file`,

    `${style} ${type}`,

    `${colors} design`,

    `${subject} art`

  ];


  const unique = [];


  possible.forEach(tag => {

    tag =
    tag
    .replace(/\s+/g," ")
    .trim();


    if(
      tag &&
      !unique
      .some(existing =>
        existing
        .toLowerCase() ===
        tag.toLowerCase()
      )
    ) {

      unique.push(tag);

    }

  });


  while(unique.length < 13) {

    unique.push(
      `${randomFrom(listingDescriptors)} ${subject}`
    );

  }


  return unique.slice(0,13);

}


/* ---------- SHOW 13 TAGS ---------- */

function displayTags(tags) {

  const holder =
  document.getElementById(
    "listingTags"
  );


  holder.innerHTML = "";


  tags.forEach(
    (tag,index) => {

      const wrapper =
      document.createElement(
        "div"
      );

      wrapper.className =
      "tag-box";


      const number =
      document.createElement(
        "div"
      );

      number.className =
      "tag-number";

      number.textContent =
      index + 1;


      const input =
      document.createElement(
        "input"
      );

      input.type =
      "text";

      input.value =
      tag;

      input.className =
      "listing-tag";


      wrapper.append(
        number,
        input
      );


      holder.appendChild(
        wrapper
      );

    }
  );


  updateTagCounter();

}


/* ---------- TAG COUNTER ---------- */

function updateTagCounter() {

  const tags =
  [
    ...document
    .querySelectorAll(
      ".listing-tag"
    )
  ];


  const filled =
  tags.filter(
    tag =>
    tag.value.trim()
  ).length;


  document
  .getElementById(
    "tagCounter"
  )
  .textContent =
  `${filled} / 13`;

}


/* ---------- GENERATE ---------- */

function generateProductListing() {

  const type =
  document
  .getElementById(
    "listingProductType"
  ).value;


  let subject =
  document
  .getElementById(
    "listingSubject"
  ).value.trim();


  let theme =
  document
  .getElementById(
    "listingTheme"
  ).value.trim();


  const style =
  document
  .getElementById(
    "listingStyle"
  ).value;


  let colors =
  document
  .getElementById(
    "listingColors"
  ).value.trim();


  const details =
  document
  .getElementById(
    "listingDetails"
  ).value.trim();


  if(!subject) {

    subject =
    randomFrom(
      surpriseSubjects
    );

  }


  if(!theme) {

    theme =
    randomFrom(
      surpriseThemes
    );

  }


  if(!colors) {

    colors =
    randomFrom(
      surpriseColors
    );

  }


  const descriptor =
  randomFrom(
    listingDescriptors
  );


  /* TITLE */

  let title =

  `${theme} ${subject} ${type} | ` +
  `${style} Digital Design | ` +
  `${descriptor} ${subject} Download`;


  if(style === "simple") {

    title =
    `${theme} ${subject} ${type} Digital Download`;

  }


  document
  .getElementById(
    "listingTitle"
  ).value =
  title;


  /* SHORT DESCRIPTION */

  document
  .getElementById(
    "listingShortDescription"
  ).value =

  `${descriptor} ${theme} ${subject} ${type} featuring ${colors}. ` +
  `Perfect for creative digital and craft projects.`;


  /* FULL DESCRIPTION */

  let description =

`✨ ${theme} ${subject} ${type}

Add a ${descriptor} touch to your next creative project with this ${style} ${subject} design.

🎨 DESIGN DETAILS
• Theme: ${theme}
• Subject: ${subject}
• Style: ${style}
• Colors: ${colors}
${details ? `• Extra details: ${details}` : ""}

📦 DIGITAL PRODUCT
This is a digital download. No physical product will be shipped.

💡 GREAT FOR
• Sublimation projects
• Shirts and apparel
• Tumblers
• Stickers
• Scrapbooking
• Custom gifts
• Small business crafting
• Personal creative projects

🌙 IMPORTANT
Colors may appear slightly different depending on your screen, printer and materials.

Please review your shop's license or usage terms before using this design commercially.`;


  document
  .getElementById(
    "listingDescription"
  ).value =
  description;


  /* KEYWORDS */

  const keywords = [

    subject,
    theme,
    type,
    style,
    colors,
    `${theme} ${subject}`,
    `${subject} ${type}`,
    `${theme} ${type}`,
    `${subject} digital download`,
    `${style} design`

  ];


  document
  .getElementById(
    "listingKeywords"
  ).value =
  keywords.join(", ");


  /* 13 TAGS */

  const tags =
  buildTags(
    subject,
    theme,
    type,
    colors,
    style
  );


  displayTags(tags);


  document
  .getElementById(
    "listingStatus"
  ).textContent =
  "✨ Listing generated!";

}


/* ---------- NEW TAGS ---------- */

function regenerateTags() {

  const subject =
  document
  .getElementById(
    "listingSubject"
  ).value.trim()
  ||
  randomFrom(
    surpriseSubjects
  );


  const theme =
  document
  .getElementById(
    "listingTheme"
  ).value.trim()
  ||
  randomFrom(
    surpriseThemes
  );


  const type =
  document
  .getElementById(
    "listingProductType"
  ).value;


  const colors =
  document
  .getElementById(
    "listingColors"
  ).value.trim()
  ||
  randomFrom(
    surpriseColors
  );


  const style =
  document
  .getElementById(
    "listingStyle"
  ).value;


  displayTags(

    buildTags(
      subject,
      theme,
      type,
      colors,
      style
    )

  );

}


/* ---------- SURPRISE ---------- */

function surpriseListing() {

  document
  .getElementById(
    "listingSubject"
  ).value =
  randomFrom(
    surpriseSubjects
  );


  document
  .getElementById(
    "listingTheme"
  ).value =
  randomFrom(
    surpriseThemes
  );


  document
  .getElementById(
    "listingColors"
  ).value =
  randomFrom(
    surpriseColors
  );


  generateProductListing();

}


/* ---------- COPY FIELD ---------- */

async function copyField(id) {

  const field =
  document.getElementById(id);


  await navigator
  .clipboard
  .writeText(
    field.value
  );


  document
  .getElementById(
    "listingStatus"
  ).textContent =
  "📋 Copied!";

}


/* ---------- COPY TAGS ---------- */

async function copyAllTags() {

  const tags =
  [
    ...document
    .querySelectorAll(
      ".listing-tag"
    )
  ]

  .map(tag =>
    tag.value.trim()
  )

  .filter(Boolean);


  await navigator
  .clipboard
  .writeText(
    tags.join(", ")
  );


  document
  .getElementById(
    "listingStatus"
  ).textContent =
  "📋 All 13 tags copied!";

}


/* ---------- COPY EVERYTHING ---------- */

async function copyEntireListing() {

  const title =
  document
  .getElementById(
    "listingTitle"
  ).value;


  const description =
  document
  .getElementById(
    "listingDescription"
  ).value;


  const tags =
  [
    ...document
    .querySelectorAll(
      ".listing-tag"
    )
  ]

  .map(tag =>
    tag.value.trim()
  )

  .filter(Boolean)
  .join(", ");


  const text =

`TITLE

${title}


DESCRIPTION

${description}


13 TAGS

${tags}`;


  await navigator
  .clipboard
  .writeText(text);


  document
  .getElementById(
    "listingStatus"
  ).textContent =
  "📦 Entire listing copied!";

}


/* START WITH 13 EMPTY TAGS */

displayTags(
  Array(13).fill("")
);

</script>
