<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>Moonlight Designs Workshop</title>

<style>

:root {
  --bg:#070817;
  --panel:#12152eee;
  --panel2:#0c1026;
  --line:#343967;
  --txt:#f8f5ff;
  --muted:#aaa9c6;
  --pink:#ff63c8;
  --purple:#9d76ff;
  --blue:#5bcaff;
  --ok:#68e0b1;
  --bad:#ff7796;
}

* {
  box-sizing:border-box;
}

body {
  margin:0;
  background:
    radial-gradient(circle at 15% 0,#33246c 0,transparent 28%),
    radial-gradient(circle at 90% 10%,#124b6d 0,transparent 25%),
    var(--bg);

  color:var(--txt);
  font-family:system-ui,-apple-system,sans-serif;
  min-height:100vh;
}

header {
  text-align:center;
  padding:24px 12px 12px;
}

h1 {
  margin:0;
  font-size:clamp(28px,6vw,48px);

  background:
    linear-gradient(
      90deg,
      var(--pink),
      #eee4ff,
      var(--blue)
    );

  -webkit-background-clip:text;
  color:transparent;
}

</style>
</head>

<body>

<header>
  <h1>☾ Moonlight Designs Workshop ✦</h1>

  <div class="muted">
    Local creative toolbox • mobile friendly • no AI key required
  </div>
</header>
